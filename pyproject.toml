[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cheevopresence"
description = "Mirror your RetroAchievements activity to Discord Rich Presence."
readme = "README.md"
license = { file = "LICENSE" }
# The code uses PEP 604 unions (X | None) and other 3.10+ syntax.
requires-python = ">=3.10"
dynamic = ["version"]

[tool.setuptools.packages.find]
include = ["desktop*"]

[tool.setuptools.dynamic]
# Single source of truth for the version stays desktop/core/constants.py.
version = { attr = "desktop.core.constants.APP_VERSION" }

[tool.ruff]
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Ignore list for UI cleanup
"desktop/shell/tk_settings.py" = ["ALL"]
"desktop/shell/tk_widgets.py" = ["ALL"]
"desktop/shell/windows/ui.py" = ["ALL"]
"ra_discord_rp.py" = ["ALL"]

[tool.mypy]
python_version = "3.10"
files = ["desktop"]
# pystray, pywebview, gi, and the pyobjc modules ship no type stubs.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["desktop"]
