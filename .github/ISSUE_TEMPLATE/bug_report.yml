name: Bug report
description: Something isn't working the way it should
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
      placeholder: |
        I expected CheevoPresence to do X, but instead it did Y.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch CheevoPresence
        2. Connect with my RA username + Web API key
        3. Start a game
        4. …
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CheevoPresence version
      description: Shown in the settings window (e.g. 1.3.2)
    validations:
      required: true
  - type: dropdown
    id: discord-running
    attributes:
      label: Was the Discord desktop app running on the same PC?
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Zip your logs folder (see the README's Diagnostic Logs section) and drag it in here.
        API keys are redacted, but file paths are not.
      placeholder: Drag & drop the log zip here, or paste the relevant lines.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I'm on the latest release
          required: true
