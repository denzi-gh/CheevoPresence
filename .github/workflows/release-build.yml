name: release build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.2.3"
        required: false
        type: string
  push:
    branches: [main]

jobs:
  preflight:
    name: check version marker
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.version.outputs.should_build }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: read head commit message
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          message="$(git log -1 --pretty=%B)"
          input_version="${INPUT_VERSION:-}"
          version=""
          if [[ -n "$input_version" ]]; then
            if [[ "$input_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              version="$input_version"
            else
              echo "::warning::Ignoring invalid workflow_dispatch version '$input_version'. Expected vX.Y.Z."
            fi
          fi
          if [[ -z "$version" ]]; then
            version="$(printf '%s\n' "$message" | grep -Eo '(^|[^[:alnum:]])v[0-9]+\.[0-9]+\.[0-9]+([^[:alnum:]]|$)' | head -n 1 | grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' || true)"
          fi
          if [[ -n "$version" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: verify APP_VERSION matches release version
        if: steps.version.outputs.should_build == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          app_version="$(python3 -c 'from desktop.core.constants import APP_VERSION; print(APP_VERSION)')"
          if [[ "v$app_version" != "$VERSION" ]]; then
            echo "::error::Release version $VERSION does not match APP_VERSION=$app_version in desktop/core/constants.py. A binary built from this commit would report itself as v$app_version, so the self-updater would keep offering $VERSION forever. Bump APP_VERSION (or fix the version marker) and retry."
            exit 1
          fi
          echo "APP_VERSION=$app_version matches $VERSION"

      - name: explain skipped build
        if: steps.version.outputs.should_build != 'true'
        run: echo "release artifacts are only built when the workflow input or head commit message contains a version like v1.2.3"

  build:
    needs: preflight
    if: needs.preflight.outputs.should_build == 'true'
    uses: ./.github/workflows/build.yml

  draft-release:
    name: draft release
    runs-on: ubuntu-latest
    needs: [preflight, build]
    if: needs.preflight.outputs.should_build == 'true'
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: download windows artifact
        uses: actions/download-artifact@v8
        with:
          name: CheevoPresence.exe
          path: downloaded/windows
          skip-decompress: true

      - name: download windows checksum
        uses: actions/download-artifact@v8
        with:
          name: CheevoPresence.exe.sha256
          path: downloaded/windows
          skip-decompress: true

      - name: download macos artifact (arm64)
        uses: actions/download-artifact@v8
        with:
          name: CheevoPresence-macos-arm64.zip
          path: downloaded/macos
          skip-decompress: true

      - name: download macos checksum (arm64)
        uses: actions/download-artifact@v8
        with:
          name: CheevoPresence-macos-arm64.zip.sha256
          path: downloaded/macos
          skip-decompress: true

      - name: download macos artifact (x86_64)
        uses: actions/download-artifact@v8
        with:
          name: CheevoPresence-macos-x86_64.zip
          path: downloaded/macos
          skip-decompress: true

      - name: download macos checksum (x86_64)
        uses: actions/download-artifact@v8
        with:
          name: CheevoPresence-macos-x86_64.zip.sha256
          path: downloaded/macos
          skip-decompress: true

      - name: download linux artifact
        uses: actions/download-artifact@v8
        with:
          name: CheevoPresence-linux-x86_64.tar.gz
          path: downloaded/linux
          skip-decompress: true

      - name: download linux checksum
        uses: actions/download-artifact@v8
        with:
          name: CheevoPresence-linux-x86_64.tar.gz.sha256
          path: downloaded/linux
          skip-decompress: true

      - name: prepare release notes
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          notes_source=".github/release-notes/${VERSION}.md"
          if [[ -f "$notes_source" ]]; then
            cp "$notes_source" release-notes.md
          else
            git log -1 --pretty=%B > release-notes.md
          fi
          {
            printf '\n'
            printf '%s\n' 'SHA-256 checksum files are attached for each platform asset.'
          } >> release-notes.md

      - name: create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          assets=(
            "downloaded/windows/CheevoPresence.exe"
            "downloaded/windows/CheevoPresence.exe.sha256"
            # Keep the arm64 zip listed before x86_64: clients up to v1.3.2
            # self-update to the first macOS zip in the release asset list,
            # and those installs are arm64.
            "downloaded/macos/CheevoPresence-macos-arm64.zip"
            "downloaded/macos/CheevoPresence-macos-arm64.zip.sha256"
            "downloaded/macos/CheevoPresence-macos-x86_64.zip"
            "downloaded/macos/CheevoPresence-macos-x86_64.zip.sha256"
            "downloaded/linux/CheevoPresence-linux-x86_64.tar.gz"
            "downloaded/linux/CheevoPresence-linux-x86_64.tar.gz.sha256"
          )

          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "::error::Missing release asset: $asset"
              exit 1
            fi
          done

          if gh release view "$VERSION" --json isDraft --jq '.isDraft' > release-is-draft.txt 2>/dev/null; then
            is_draft="$(cat release-is-draft.txt)"
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Release $VERSION already exists and is published; refusing to overwrite assets."
              exit 1
            fi
            gh release edit "$VERSION" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes-file release-notes.md
            gh release upload "$VERSION" "${assets[@]}" --clobber
          else
            gh release create "$VERSION" "${assets[@]}" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes-file release-notes.md
          fi
