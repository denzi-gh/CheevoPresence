name: release build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.2.3"
        required: false
        type: string
  push:
    branches: [main]

jobs:
  preflight:
    name: check version marker
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.version.outputs.should_build }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: read head commit message
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          message="$(git log -1 --pretty=%B)"
          input_version="${INPUT_VERSION:-}"
          version=""
          if [[ -n "$input_version" ]]; then
            if [[ "$input_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              version="$input_version"
            else
              echo "::warning::Ignoring invalid workflow_dispatch version '$input_version'. Expected vX.Y.Z."
            fi
          fi
          if [[ -z "$version" ]]; then
            version="$(printf '%s\n' "$message" | grep -Eo '(^|[^[:alnum:]])v[0-9]+\.[0-9]+\.[0-9]+([^[:alnum:]]|$)' | head -n 1 | grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' || true)"
          fi
          if [[ -n "$version" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: explain skipped build
        if: steps.version.outputs.should_build != 'true'
        run: echo "release artifacts are only built when the workflow input or head commit message contains a version like v1.2.3"

  windows:
    name: windows artifact
    runs-on: windows-latest
    needs: preflight
    if: needs.preflight.outputs.should_build == 'true'

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/windows.txt

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/windows.txt pyinstaller==6.19.0

      - name: build exe
        shell: pwsh
        run: ./build_exe.ps1

      - name: prepare artifact
        shell: pwsh
        run: |
          $assetDir = "release-assets/windows"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          Copy-Item -LiteralPath "dist/CheevoPresence.exe" -Destination "$assetDir/CheevoPresence.exe"
          Push-Location $assetDir
          ((Get-FileHash -LiteralPath "CheevoPresence.exe" -Algorithm SHA256).Hash.ToLower() + "  CheevoPresence.exe") |
            Out-File -FilePath "CheevoPresence.exe.sha256" -Encoding ascii
          Pop-Location

      - name: upload exe
        uses: actions/upload-artifact@v7
        with:
          path: release-assets/windows/CheevoPresence.exe
          archive: false
          if-no-files-found: error

      - name: upload checksum
        uses: actions/upload-artifact@v7
        with:
          path: release-assets/windows/CheevoPresence.exe.sha256
          archive: false
          if-no-files-found: error

  macos:
    name: macos artifact
    runs-on: macos-latest
    needs: preflight
    if: needs.preflight.outputs.should_build == 'true'

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install build python
        run: brew install python@3.12 python-tk@3.12 tcl-tk

      - name: build app
        run: ./build_macos.sh

      - name: prepare artifact
        shell: bash
        run: |
          mkdir -p release-assets/macos
          cp dist/CheevoPresence-macos.zip release-assets/macos/CheevoPresence-macos.zip
          cd release-assets/macos
          shasum -a 256 CheevoPresence-macos.zip > CheevoPresence-macos.zip.sha256

      - name: upload zip
        uses: actions/upload-artifact@v7
        with:
          path: release-assets/macos/CheevoPresence-macos.zip
          archive: false
          if-no-files-found: error

      - name: upload checksum
        uses: actions/upload-artifact@v7
        with:
          path: release-assets/macos/CheevoPresence-macos.zip.sha256
          archive: false
          if-no-files-found: error

  linux:
    name: linux artifact
    runs-on: ubuntu-22.04
    needs: preflight
    if: needs.preflight.outputs.should_build == 'true'

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv \
            python3-pip \
            python3-tk \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.0 \
            gir1.2-ayatanaappindicator3-0.1 \
            libayatana-appindicator3-1

      - name: build binary
        run: ./build_linux.sh


      - name: prepare artifact
        shell: bash
        run: |
          package="CheevoPresence-linux-x86_64"
          staging="release-assets/linux/$package"
          mkdir -p "$staging"
          cp dist/CheevoPresence "$staging/CheevoPresence"
          cp dist/CheevoPresence.png "$staging/CheevoPresence.png"
          cp scripts/linux_install.sh "$staging/install.sh"
          chmod +x "$staging/CheevoPresence" "$staging/install.sh"
          # The tarball exists to carry the executable bit; losing it silently
          # would put users straight back to "chmod +x".
          for entry in "$staging/CheevoPresence" "$staging/install.sh"; do
            if [[ ! -x "$entry" ]]; then
              echo "::error::$entry is not executable, the package would be broken"
              exit 1
            fi
          done
          tar -czf "release-assets/linux/$package.tar.gz" -C release-assets/linux "$package"
          cd release-assets/linux
          sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"

      - name: upload tarball
        uses: actions/upload-artifact@v7
        with:
          path: release-assets/linux/CheevoPresence-linux-x86_64.tar.gz
          archive: false
          if-no-files-found: error

      - name: upload checksum
        uses: actions/upload-artifact@v7
        with:
          path: release-assets/linux/CheevoPresence-linux-x86_64.tar.gz.sha256
          archive: false
          if-no-files-found: error

  draft-release:
    name: draft release
    runs-on: ubuntu-latest
    needs: [preflight, windows, macos, linux]
    if: needs.preflight.outputs.should_build == 'true'
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: download windows artifact
        uses: actions/download-artifact@v8
        with:
          name: CheevoPresence.exe
          path: downloaded/windows
          skip-decompress: true

      - name: download windows checksum
        uses: actions/download-artifact@v8
        with:
          name: CheevoPresence.exe.sha256
          path: downloaded/windows
          skip-decompress: true

      - name: download macos artifact
        uses: actions/download-artifact@v8
        with:
          name: CheevoPresence-macos.zip
          path: downloaded/macos
          skip-decompress: true

      - name: download macos checksum
        uses: actions/download-artifact@v8
        with:
          name: CheevoPresence-macos.zip.sha256
          path: downloaded/macos
          skip-decompress: true

      - name: download linux artifact
        uses: actions/download-artifact@v8
        with:
          name: CheevoPresence-linux-x86_64.tar.gz
          path: downloaded/linux
          skip-decompress: true

      - name: download linux checksum
        uses: actions/download-artifact@v8
        with:
          name: CheevoPresence-linux-x86_64.tar.gz.sha256
          path: downloaded/linux
          skip-decompress: true

      - name: prepare release notes
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          notes_source=".github/release-notes/${VERSION}.md"
          if [[ -f "$notes_source" ]]; then
            cp "$notes_source" release-notes.md
          else
            git log -1 --pretty=%B > release-notes.md
          fi
          {
            printf '\n'
            printf '%s\n' 'SHA-256 checksum files are attached for each platform asset.'
          } >> release-notes.md

      - name: create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          assets=(
            "downloaded/windows/CheevoPresence.exe"
            "downloaded/windows/CheevoPresence.exe.sha256"
            "downloaded/macos/CheevoPresence-macos.zip"
            "downloaded/macos/CheevoPresence-macos.zip.sha256"
            "downloaded/linux/CheevoPresence-linux-x86_64.tar.gz"
            "downloaded/linux/CheevoPresence-linux-x86_64.tar.gz.sha256"
          )

          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "::error::Missing release asset: $asset"
              exit 1
            fi
          done

          if gh release view "$VERSION" --json isDraft --jq '.isDraft' > release-is-draft.txt 2>/dev/null; then
            is_draft="$(cat release-is-draft.txt)"
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Release $VERSION already exists and is published; refusing to overwrite assets."
              exit 1
            fi
            gh release edit "$VERSION" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes-file release-notes.md
            gh release upload "$VERSION" "${assets[@]}" --clobber
          else
            gh release create "$VERSION" "${assets[@]}" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes-file release-notes.md
          fi
