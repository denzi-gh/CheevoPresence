name: build artifacts

on:
  workflow_dispatch:

jobs:
  windows:
    name: windows artifact
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/windows.txt

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/windows.txt pyinstaller==6.19.0

      - name: build exe
        shell: pwsh
        run: ./build_exe.ps1

      - name: prepare artifact
        shell: pwsh
        run: |
          $assetDir = "release-assets/windows"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          Copy-Item -LiteralPath "dist/CheevoPresence.exe" -Destination "$assetDir/CheevoPresence.exe"
          Push-Location $assetDir
          ((Get-FileHash -LiteralPath "CheevoPresence.exe" -Algorithm SHA256).Hash.ToLower() + "  CheevoPresence.exe") |
            Out-File -FilePath "CheevoPresence.exe.sha256" -Encoding ascii
          Pop-Location

      - name: upload exe
        uses: actions/upload-artifact@v7
        with:
          path: release-assets/windows/CheevoPresence.exe
          archive: false
          if-no-files-found: error

      - name: upload checksum
        uses: actions/upload-artifact@v7
        with:
          path: release-assets/windows/CheevoPresence.exe.sha256
          archive: false
          if-no-files-found: error

  macos:
    name: macos artifact
    runs-on: macos-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install build python
        run: brew install python@3.12 python-tk@3.12 tcl-tk

      - name: build app
        run: ./build_macos.sh

      - name: prepare artifact
        shell: bash
        run: |
          mkdir -p release-assets/macos
          cp dist/CheevoPresence-macos.zip release-assets/macos/CheevoPresence-macos.zip
          cd release-assets/macos
          shasum -a 256 CheevoPresence-macos.zip > CheevoPresence-macos.zip.sha256

      - name: upload zip
        uses: actions/upload-artifact@v7
        with:
          path: release-assets/macos/CheevoPresence-macos.zip
          archive: false
          if-no-files-found: error

      - name: upload checksum
        uses: actions/upload-artifact@v7
        with:
          path: release-assets/macos/CheevoPresence-macos.zip.sha256
          archive: false
          if-no-files-found: error

  linux:
    name: linux artifact
    runs-on: ubuntu-22.04

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv \
            python3-pip \
            python3-tk \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-ayatanaappindicator3-0.1 \
            libayatana-appindicator3-1

      - name: build binary
        run: ./build_linux.sh

      - name: prepare artifact
        shell: bash
        run: |
          package="CheevoPresence-linux-x86_64"
          staging="release-assets/linux/$package"
          mkdir -p "$staging"
          cp dist/CheevoPresence "$staging/CheevoPresence"
          cp dist/CheevoPresence.png "$staging/CheevoPresence.png"
          cp scripts/linux_install.sh "$staging/install.sh"
          chmod +x "$staging/CheevoPresence" "$staging/install.sh"
          for entry in "$staging/CheevoPresence" "$staging/install.sh"; do
            if [[ ! -x "$entry" ]]; then
              echo "::error::$entry is not executable, the package would be broken"
              exit 1
            fi
          done
          tar -czf "release-assets/linux/$package.tar.gz" -C release-assets/linux "$package"
          cd release-assets/linux
          sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"

      - name: upload tarball
        uses: actions/upload-artifact@v7
        with:
          path: release-assets/linux/CheevoPresence-linux-x86_64.tar.gz
          archive: false
          if-no-files-found: error

      - name: upload checksum
        uses: actions/upload-artifact@v7
        with:
          path: release-assets/linux/CheevoPresence-linux-x86_64.tar.gz.sha256
          archive: false
          if-no-files-found: error
