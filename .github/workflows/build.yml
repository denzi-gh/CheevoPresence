name: build

# Reusable build workflow shared by build-artifacts.yml (manual) and
# release-build.yml (release). It builds the Windows, macOS, and Linux
# artifacts and uploads them and the caller decides when to invokes it
on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: windows artifact
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/windows.txt
            requirements/build.txt

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/windows.txt -r requirements/build.txt

      - name: build exe
        shell: pwsh
        run: ./build_exe.ps1

      # Temporary Windows Defender scan to scan for false positive. This is a small measure to (hopefully) catch false positives
      - name: defender scan
        shell: pwsh
        run: |
          $mpCmdRun = Join-Path $env:ProgramFiles "Windows Defender/MpCmdRun.exe"
          if (-not (Test-Path $mpCmdRun)) {
            Write-Warning "MpCmdRun.exe not found; skipping Defender scan"
            exit 0
          }
          & $mpCmdRun -SignatureUpdate
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Defender signature update failed (exit $LASTEXITCODE); scanning with the runner's signatures"
          }
          & $mpCmdRun -Scan -ScanType 3 -File "$PWD/dist/CheevoPresence.exe" -DisableRemediation
          if ($LASTEXITCODE -eq 2) {
            Write-Error "Windows Defender flagged dist/CheevoPresence.exe"
            exit 1
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Defender scan did not complete cleanly (exit $LASTEXITCODE)"
          }

      - name: prepare artifact
        shell: pwsh
        run: |
          $assetDir = "release-assets/windows"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          Copy-Item -LiteralPath "dist/CheevoPresence.exe" -Destination "$assetDir/CheevoPresence.exe"
          Push-Location $assetDir
          ((Get-FileHash -LiteralPath "CheevoPresence.exe" -Algorithm SHA256).Hash.ToLower() + "  CheevoPresence.exe") |
            Out-File -FilePath "CheevoPresence.exe.sha256" -Encoding ascii
          Pop-Location

      - name: upload exe
        uses: actions/upload-artifact@v7
        with:
          path: release-assets/windows/CheevoPresence.exe
          archive: false
          if-no-files-found: error

      - name: upload checksum
        uses: actions/upload-artifact@v7
        with:
          path: release-assets/windows/CheevoPresence.exe.sha256
          archive: false
          if-no-files-found: error

  macos:
    name: macos artifact (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15-intel is available until August 2027 in GitHub
          # Note to me: stop supporting Intel Mac builds after that
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: install build python
        shell: bash
        env:
          HOMEBREW_NO_PATH_SHADOW_CHECK: "1"
        run: |
          brew install python@3.12 || brew link --overwrite python@3.12
          brew install python-tk@3.12 tcl-tk
          # Pin the build to the keg path so it works even when linking
          # into /usr/local was skipped or failed.
          echo "CHEEVO_MACOS_PYTHON=$(brew --prefix python@3.12)/bin/python3.12" >> "$GITHUB_ENV"

      - name: build app
        run: ./build_macos.sh

      - name: prepare artifact
        shell: bash
        run: |
          mkdir -p release-assets/macos
          cp "dist/CheevoPresence-macos-${{ matrix.arch }}.zip" release-assets/macos/
          cd release-assets/macos
          shasum -a 256 "CheevoPresence-macos-${{ matrix.arch }}.zip" > "CheevoPresence-macos-${{ matrix.arch }}.zip.sha256"

      - name: upload zip
        uses: actions/upload-artifact@v7
        with:
          path: release-assets/macos/CheevoPresence-macos-${{ matrix.arch }}.zip
          archive: false
          if-no-files-found: error

      - name: upload checksum
        uses: actions/upload-artifact@v7
        with:
          path: release-assets/macos/CheevoPresence-macos-${{ matrix.arch }}.zip.sha256
          archive: false
          if-no-files-found: error

  linux:
    name: linux artifact
    runs-on: ubuntu-22.04

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv \
            python3-pip \
            python3-tk \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.0 \
            gir1.2-ayatanaappindicator3-0.1 \
            libayatana-appindicator3-1

      - name: build binary
        run: ./build_linux.sh

      - name: prepare artifact
        shell: bash
        run: |
          package="CheevoPresence-linux-x86_64"
          staging="release-assets/linux/$package"
          mkdir -p "$staging"
          cp dist/CheevoPresence "$staging/CheevoPresence"
          cp dist/CheevoPresence.png "$staging/CheevoPresence.png"
          cp scripts/linux_install.sh "$staging/install.sh"
          chmod +x "$staging/CheevoPresence" "$staging/install.sh"
          # The tarball exists to carry the executable bit; losing it silently
          # would put users straight back to "chmod +x".
          for entry in "$staging/CheevoPresence" "$staging/install.sh"; do
            if [[ ! -x "$entry" ]]; then
              echo "::error::$entry is not executable, the package would be broken"
              exit 1
            fi
          done
          tar -czf "release-assets/linux/$package.tar.gz" -C release-assets/linux "$package"
          cd release-assets/linux
          sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"

      - name: upload tarball
        uses: actions/upload-artifact@v7
        with:
          path: release-assets/linux/CheevoPresence-linux-x86_64.tar.gz
          archive: false
          if-no-files-found: error

      - name: upload checksum
        uses: actions/upload-artifact@v7
        with:
          path: release-assets/linux/CheevoPresence-linux-x86_64.tar.gz.sha256
          archive: false
          if-no-files-found: error
